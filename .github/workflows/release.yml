name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/nickhutchinson/nickhutchinson.github.io/releases/latest/download/wasm-tools-x86_64-linux.tar.gz
          tar xzf wasm-tools-x86_64-linux.tar.gz
          sudo mv wasm-tools /usr/local/bin/
          wasm-tools --version

      - name: Build
        run: dotnet build src/Fable.WasmGc.fsproj -c Release

      - name: QuickTest
        run: cd tests/QuickTest && bash run.sh

      - name: Showcase
        run: cd tests/Showcase && bash run.sh

      - name: Component Embed
        run: cd examples/component-embed && bash run.sh

      - name: Component Linking
        run: cd examples/component-linking && bash run.sh

      - name: Publish compiler (linux-x64)
        run: |
          dotnet publish vendor/Fable/src/Fable.Cli/Fable.Cli.fsproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            -o publish/linux-x64

      - name: Publish compiler (win-x64)
        run: |
          dotnet publish vendor/Fable/src/Fable.Cli/Fable.Cli.fsproj \
            -c Release \
            -r win-x64 \
            --self-contained \
            -o publish/win-x64

      - name: Publish compiler (osx-x64)
        run: |
          dotnet publish vendor/Fable/src/Fable.Cli/Fable.Cli.fsproj \
            -c Release \
            -r osx-x64 \
            --self-contained \
            -o publish/osx-x64

      - name: Publish compiler (osx-arm64)
        run: |
          dotnet publish vendor/Fable/src/Fable.Cli/Fable.Cli.fsproj \
            -c Release \
            -r osx-arm64 \
            --self-contained \
            -o publish/osx-arm64

      - name: Package artifacts
        run: |
          cd publish
          tar czf fsharp-wasm-linux-x64.tar.gz -C linux-x64 .
          tar czf fsharp-wasm-osx-x64.tar.gz -C osx-x64 .
          tar czf fsharp-wasm-osx-arm64.tar.gz -C osx-arm64 .
          cd win-x64 && zip -r ../fsharp-wasm-win-x64.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/fsharp-wasm-linux-x64.tar.gz
            publish/fsharp-wasm-osx-x64.tar.gz
            publish/fsharp-wasm-osx-arm64.tar.gz
            publish/fsharp-wasm-win-x64.zip
