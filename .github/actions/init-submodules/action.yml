name: Init submodules
description: >-
  Initialises the two build-time submodules, vendor/Fable (the Fable fork the backend is built on) and vendor/fsharp
  (the patched F# compiler).  The sibling repositories (fsharp-wasm-core, -runtime, -graphics, fsharp-glyph-aura,
  fsharp-wasmecto) are not submodules: they are separate products with their own releases.

runs:
  using: composite
  steps:
    - shell: bash
      run: git submodule update --init --depth 1 vendor/Fable vendor/fsharp
