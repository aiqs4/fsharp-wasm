name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Cache the patched fsc.dll — only rebuild when vendor/fsharp submodule HEAD changes.
      - name: Cache patched fsc.dll
        id: cache-fsc
        uses: actions/cache@v5
        with:
          path: vendor/fsharp/artifacts/bin/fsc/Release/net10.0
          key: fsc-${{ runner.os }}-${{ hashFiles('vendor/fsharp') }}

      - name: Build patched fsharp compiler (if not cached)
        if: steps.cache-fsc.outputs.cache-hit != 'true'
        run: |
          cd vendor/fsharp
          chmod +x build.sh
          ./build.sh -c Release -projects src/Compiler/FSharp.Compiler.Service.fsproj
          echo "fsc.dll rebuilt:"
          ls artifacts/bin/fsc/Release/net10.0/fsc.dll

      - name: Install wasm-tools
        continue-on-error: true
        run: |
          RELEASE_URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=[x['browser_download_url'] for x in d['assets'] if 'x86_64-linux' in x['name'] and x['name'].endswith('.tar.gz')]; print(a[0])")
          curl -LO "$RELEASE_URL"
          tar xzf wasm-tools-*.tar.gz
          find . -maxdepth 2 -name wasm-tools -type f | head -1 | xargs -I{} sudo install -m755 {} /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Restore dotnet tools (FAKE)
        run: dotnet tool restore

      - name: Build + QuickTest + Showcase
        env:
          FSHARP_COMPILER: ${{ github.workspace }}/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: dotnet fake run build.fsx --target Showcase

      - name: Component Embed
        env:
          FSHARP_COMPILER: ${{ github.workspace }}/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: cd examples/component-embed && bash run.sh

      - name: Component Linking
        env:
          FSHARP_COMPILER: ${{ github.workspace }}/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: cd examples/component-linking && bash run.sh
