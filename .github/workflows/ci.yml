name: CI

on:
  push:
    branches: [main, develop, claude/adoring-meitner-3oy6pn]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      # vendor/Fable and vendor/fsharp are public and all that is needed to build the patched compiler,
      # the CLI and tests/QuickTest.
      - name: Init public submodules
        run: git submodule update --init --depth 1 vendor/Fable vendor/fsharp

      # The other submodules are private repos: the default GITHUB_TOKEN cannot read them. Provide a
      # token with Contents: read on them as the SUBMODULES_TOKEN secret to run the full pipeline.
      - name: Init private submodules (needs SUBMODULES_TOKEN)
        id: private
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          if [ -z "$SUBMODULES_TOKEN" ]; then
            echo "SUBMODULES_TOKEN not set: private submodules skipped, running the public subset only."
            echo "available=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SUBMODULES_TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$SUBMODULES_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" submodule update --init --depth 1 \
            fsharp-glyph-aura fsharp-wasm-core fsharp-wasm-graphics fsharp-wasm-runtime fsharp-wasmecto
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # FAKE 6 runs on net6.0 and needs its targeting pack, which the current runner image no longer ships.
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Patched F# compiler
        id: fsc
        uses: ./.github/actions/patched-fsc

      - name: Install wasm-tools
        continue-on-error: true
        run: |
          RELEASE_URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=[x['browser_download_url'] for x in d['assets'] if 'x86_64-linux' in x['name'] and x['name'].endswith('.tar.gz')]; print(a[0])")
          curl -LO "$RELEASE_URL"
          tar xzf wasm-tools-*.tar.gz
          find . -maxdepth 2 -name wasm-tools -type f | head -1 | xargs -I{} sudo install -m755 {} /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Restore dotnet tools (FAKE)
        run: dotnet tool restore

      # Full pipeline (needs the private fsharp-wasm-core for BuildCore).
      - name: Build + QuickTest + Showcase
        if: steps.private.outputs.available == 'true'
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: dotnet fake run build.fsx --target Showcase

      # Public subset: compile Fable.WasmGc + the CLI with the patched compiler, then run the QuickTest suite.
      - name: Build CLI + QuickTest (public subset)
        if: steps.private.outputs.available != 'true'
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: |
          dotnet fake run build.fsx --target BuildCli
          bash tests/QuickTest/run.sh

      - name: Component Embed
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: cd examples/component-embed && bash run.sh

      - name: Component Linking
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: cd examples/component-linking && bash run.sh
