name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: production

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Cache patched fsc.dll — only rebuild when vendor/fsharp submodule changes.
      - name: Cache patched fsc.dll
        id: cache-fsc
        uses: actions/cache@v5
        with:
          path: vendor/fsharp/artifacts/bin/fsc/Release/net10.0
          key: fsc-${{ runner.os }}-${{ hashFiles('vendor/fsharp') }}

      - name: Build patched fsharp compiler (if not cached)
        if: steps.cache-fsc.outputs.cache-hit != 'true'
        run: |
          cd vendor/fsharp
          chmod +x build.sh
          ./build.sh -c Release -projects src/Compiler/FSharp.Compiler.Service.fsproj
          ls artifacts/bin/fsc/Release/net10.0/fsc.dll

      - name: Install wasm-tools
        continue-on-error: true
        run: |
          RELEASE_URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=[x['browser_download_url'] for x in d['assets'] if 'x86_64-linux' in x['name'] and x['name'].endswith('.tar.gz')]; print(a[0])")
          curl -LO "$RELEASE_URL"
          tar xzf wasm-tools-*.tar.gz
          find . -maxdepth 2 -name wasm-tools -type f | head -1 | xargs -I{} sudo install -m755 {} /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Restore dotnet tools (FAKE)
        run: dotnet tool restore

      - name: Run full release build (Build + Test + Pack)
        env:
          FSHARP_COMPILER: ${{ github.workspace }}/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
          VERSION: ${{ github.ref_name }}
        run: dotnet fake run build.fsx --target Pack

      - name: Publish self-contained CLI binaries
        env:
          FSHARP_COMPILER: ${{ github.workspace }}/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
          VERSION: ${{ github.ref_name }}
        run: dotnet fake run build.fsx --target PublishBinaries

      - name: Package CLI binaries as archives
        run: |
          cd publish
          tar czf fsharp-wasm-linux-x64.tar.gz  -C linux-x64  .
          tar czf fsharp-wasm-osx-x64.tar.gz    -C osx-x64    .
          tar czf fsharp-wasm-osx-arm64.tar.gz  -C osx-arm64  .
          cd win-x64 && zip -r ../fsharp-wasm-win-x64.zip . && cd ..

      - name: Publish to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push publish/nuget/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      # Also publish to GitHub Packages (free repo-scoped feed — no NUGET_API_KEY needed).
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            2>/dev/null || true
          dotnet nuget push publish/nuget/*.nupkg \
            --source github \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            publish/nuget/*.nupkg
            publish/fsharp-wasm-linux-x64.tar.gz
            publish/fsharp-wasm-osx-x64.tar.gz
            publish/fsharp-wasm-osx-arm64.tar.gz
            publish/fsharp-wasm-win-x64.zip
