name: CI

on:
  push:
    branches: [main, develop, claude/adoring-meitner-3oy6pn]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      # Public submodules always; the private ones (fsharp-wasm-core, -graphics, -runtime, fsharp-glyph-aura,
      # fsharp-wasmecto) only when the SUBMODULES_TOKEN secret exists. Without it the public subset runs.
      - name: Init submodules
        id: submodules
        uses: ./.github/actions/init-submodules
        with:
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Patched F# compiler
        id: fsc
        uses: ./.github/actions/patched-fsc

      - name: Install wasm-tools
        continue-on-error: true
        run: |
          RELEASE_URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=[x['browser_download_url'] for x in d['assets'] if 'x86_64-linux' in x['name'] and x['name'].endswith('.tar.gz')]; print(a[0])")
          curl -LO "$RELEASE_URL"
          tar xzf wasm-tools-*.tar.gz
          find . -maxdepth 2 -name wasm-tools -type f | head -1 | xargs -I{} sudo install -m755 {} /usr/local/bin/wasm-tools
          wasm-tools --version

      # build.fsx (FAKE) remains the local entry point; CI runs the same steps directly. FAKE 6 needs a net6.0
      # targeting pack and a locked FSharp.Core, and both kept breaking on the runner image (see build.fsx).
      - name: Build Fable.WasmGc, CLI and (with private submodules) fsharp-wasm-core
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
          HAVE_PRIVATE: ${{ steps.submodules.outputs.private }}
        run: |
          dotnet build src/WasmGc.fsproj -c Release
          dotnet build tools/FSharp.Wasm.Cli/FSharp.Wasm.Cli.fsproj -c Release
          if [ "$HAVE_PRIVATE" = "true" ]; then
            dotnet build fsharp-wasm-core/FSharp.Wasm.Core/FSharp.WasmCore.fsproj -c Release
          fi

      - name: QuickTest
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/QuickTest/run.sh

      - name: Showcase
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: bash tests/Showcase/run.sh

      - name: Component Embed
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: cd examples/component-embed && bash run.sh

      - name: Component Linking
        env:
          FSHARP_COMPILER: ${{ steps.fsc.outputs.fsc }}
        run: cd examples/component-linking && bash run.sh
